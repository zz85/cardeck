# 每次 push 自动构建**正式签名**的 Release APK（只放 Artifacts，不发布 GitHub Release）。
#
# 版本号自动累计：`appVersionName` + 本次 run_number
#   例：0.1.13 → APK 0.1.13.42（versionCode = 1_130_042），每次推送 +1，可直接覆盖安装。
#   基础版本仍只手改 app/build.gradle.kts 的 appVersionName。
#
# 必需 Secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64    keystore 的 base64（单行无换行）
#                      Linux/macOS: base64 -w0 keystore.jks
#                      Windows:     [Convert]::ToBase64String([IO.File]::ReadAllBytes("keystore.jks"))
#   KEYSTORE_PASSWORD  storePassword
#   KEY_ALIAS          keyAlias
#   KEY_PASSWORD       keyPassword
# 可选：
#   EXPECTED_CERT_SHA256  期望的签名证书 SHA-256（带不带冒号都行）——配了就会逐字比对，
#                         防止误用别的 keystore 签出「正式版」。
#
# **没有 KEYSTORE_BASE64 会直接失败**，绝不退回 debug 签名：
# debug 证书签出去的包，日后换正式证书时所有用户必须卸载重装（AGENTS.md「签名是不可逆决定」）。
# Gradle 侧还有第二道闸：传了 -Pcardeck.buildNumber 却没有 keystore.properties 就构建失败。
name: Build Release APK

on:
  push:
    branches: ['**'] # 任何分支的推送都出包；tag 不触发（不需要发 Release）
  workflow_dispatch:

permissions:
  contents: read # 只读代码，不发 Release、不写仓库

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release-signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # AGP 8.7 要求 JDK 17，且与 app/build.gradle.kts 的 jvmTarget 一致
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts 用 rootProject.file(storeFile) 解析，所以 .jks 与
      # keystore.properties 都放仓库根（两者都已 gitignore，不会被提交）
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          # 四个值缺一不可；缺了直接失败（绝不退回 debug 签名）
          MISSING=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secrets:${MISSING}. Add them at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/secrets/actions (generate KEYSTORE_BASE64 with PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('keystore.jks'))). This pipeline only produces release-signed builds and never falls back to debug signing."
            exit 1
          fi
          # 允许粘贴多行 base64（Windows 复制常见），解码前先去掉换行
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Signing material ready (release.jks + keystore.properties)"

      - name: Compute version
        id: version
        run: |
          set -eu
          BASE=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$BASE" || { echo "::error::Could not read appVersionName from app/build.gradle.kts"; exit 1; }
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} (versionCode = base*10000 + ${GITHUB_RUN_NUMBER})"

      # 版本号由 build.gradle.kts 按同一规则计算（见文件里的 buildNumber），这里只传 run_number
      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease "-Pcardeck.buildNumber=$BUILD_NUMBER" --stacktrace

      - name: Verify signature and package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.name }}
          EXPECTED_CERT: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::$APK not found"; exit 1; }

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt

          # 配了 keystore 却仍是 debug 证书 = keystore.properties 没被读到，绝不能放出去
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::Output is debug-signed - release signing config did not take effect (check keystore.properties and the storeFile path)"
            exit 1
          fi
          CERT=$(grep "certificate SHA-256 digest" certs.txt | head -n1 | sed 's/.*digest: //')
          test -n "$CERT" || { echo "::error::Could not read signing certificate fingerprint"; exit 1; }

          if [ -n "${EXPECTED_CERT:-}" ]; then
            EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            ACTUAL=$(printf '%s' "$CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::Signing certificate does not match EXPECTED_CERT_SHA256: expected ${EXPECTED}, actual ${ACTUAL}"
              exit 1
            fi
            echo "Signing certificate matches EXPECTED_CERT_SHA256"
          fi

          NAME="CarDeck-${VERSION}-release.apk"
          cp "$APK" "$NAME"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          SIZE=$(du -h "$NAME" | cut -f1)
          {
            echo "name=$NAME"
            echo "sha=$SHA"
            echo "cert=$CERT"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "Generated ${NAME} (${SIZE})"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          overwrite: 'true' # 重跑同一 run 时版本号不变，覆盖旧产物而不是失败

      - name: Write run summary
        env:
          VERSION: ${{ steps.version.outputs.name }}
          NAME: ${{ steps.package.outputs.name }}
          SHA: ${{ steps.package.outputs.sha }}
          CERT: ${{ steps.package.outputs.cert }}
          SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -eu
          {
            echo "### CarDeck ${VERSION} (release-signed)"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| APK | ${NAME} |"
            echo "| APK size | ${SIZE} |"
            echo "| SHA-256 | ${SHA} |"
            echo "| Signing cert SHA-256 | ${CERT} |"
            echo
            echo "Install: adb install -r ${NAME}"
            echo
            echo "> The size shown in the Artifacts list is the **zip archive** size (dex is stored uncompressed in the APK, so re-zipping shrinks it to ~45%);"
            echo "> see the table above for the unzipped APK size."
          } >> "$GITHUB_STEP_SUMMARY"

      # 放在出包之后：单测挂了本次运行标红，但 APK 仍可下载
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports (for debugging failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
